nextest-version = { required = "0.9.98" }
experimental = ["setup-scripts"]

[scripts.setup.ensure-kind-cluster]
command = ["bash", "scripts/ensure-kind-cluster.sh"]
slow-timeout = { period = "2m", terminate-after = 1, grace-period = "10s" }
capture-stdout = true
capture-stderr = true

[[profile.default.scripts]]
filter = 'test(/ui::tests::kind_integration::/)'
setup = "ensure-kind-cluster"
