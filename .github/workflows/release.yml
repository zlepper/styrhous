name: Desktop packages

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      sign_artifacts:
        description: Sign validation artifacts with the package-validation key
        required: true
        type: boolean
        default: true

concurrency:
  group: desktop-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: "0.11.8"
  PACKAGE_ARTIFACT_PREFIX: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'package' || 'validation' }}
  SIGN_ARTIFACTS: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_dispatch' || inputs.sign_artifacts)) }}
  STYRHOUS_RELEASE_BUILD: "1"
  STYRHOUS_UPDATER_PUBLIC_KEY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.STYRHOUS_UPDATER_PUBLIC_KEY || vars.STYRHOUS_VALIDATION_UPDATER_PUBLIC_KEY }}

jobs:
  preflight:
    name: Prepare desktop packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Install cargo-about
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: cargo-about@0.9.1

      - name: Generate third-party legal artifacts
        run: bash scripts/generate-third-party-legal.sh

      - name: Upload third-party legal artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-legal
          path: |
            target/legal/THIRD_PARTY_LICENSES.html
            target/legal/THIRD_PARTY_SOURCE.tar.gz
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 7 || 1 }}

      - name: Verify tag and application version agree
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "styrhous") | .version')
          test "${GITHUB_REF_NAME#v}" = "$version"

  package-appimage:
    name: Package AppImage (${{ matrix.id }})
    needs: preflight
    environment: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'release' || 'package-validation' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            arch: x86_64
            runner: ubuntu-24.04

          - id: linux-aarch64
            arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Download third-party legal artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-legal
          path: target/legal

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: true
          cache-bin: true
          cache-all-crates: true
          cache-on-failure: true

      - name: Install AppImage package dependencies
        run: bash scripts/install-appimage-package-dependencies.sh

      - name: Install cargo-packager
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: cargo-packager@${{ env.CARGO_PACKAGER_VERSION }}

      - name: Verify updater signing configuration
        run: test -n "$STYRHOUS_UPDATER_PUBLIC_KEY"

      - name: Build release application
        run: cargo build --release --locked -p styrhous

      - name: Package AppImage
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ "$SIGN_ARTIFACTS" == "true" ]]; then
            test -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY"
            test -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD"
          else
            unset CARGO_PACKAGER_SIGN_PRIVATE_KEY
            unset CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD
          fi
          cargo packager \
            --manifest-path crates/styrhous/Cargo.toml \
            --release \
            --formats appimage

      - name: Generate updater manifest
        if: env.SIGN_ARTIFACTS == 'true'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/styrhous/Cargo.toml | head -1)
          bundle=$(find dist -type f -name '*.AppImage' -print -quit)
          test -n "$bundle"

          bash scripts/generate-update-manifest.sh \
            "$version" \
            linux \
            "${{ matrix.arch }}" \
            appimage \
            "$bundle" \
            "dist/styrhous-update-${{ matrix.id }}.json"

      - name: Smoke test AppImage startup
        timeout-minutes: 2
        env:
          STYRHOUS_DISABLE_AUTO_UPDATE: "1"
        run: |
          bundle=$(find dist -type f -name '*.AppImage' -exec realpath {} \; -quit)
          test -n "$bundle"
          chmod +x "$bundle"

          temporary_directory=$(mktemp -d)
          host_library=$(ldconfig -p | awk '$1 == "libxkbcommon-x11.so.0" { print $NF; exit }')
          test -n "$host_library"
          disabled_library="$host_library.styrhous-smoke-disabled"
          sudo mv "$host_library" "$disabled_library"
          trap 'sudo mv "$disabled_library" "$host_library" 2>/dev/null || true; sudo ldconfig; rm -rf "$temporary_directory"' EXIT

          (
            cd "$temporary_directory"
            "$bundle" --appimage-extract >/dev/null
            find squashfs-root -type f -name 'libxkbcommon-x11.so.0' -print -quit | grep -q .
            bash "$GITHUB_WORKSPACE/scripts/verify-packaged-legal-files.sh" squashfs-root
            bash "$GITHUB_WORKSPACE/scripts/verify-appimage-native-libraries.sh" squashfs-root
          )

          set +e
          timeout --kill-after=5s 10s xvfb-run -a "$bundle" --appimage-extract-and-run
          status=$?
          set -e
          test "$status" -eq 124

      - name: Upload AppImage package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE_ARTIFACT_PREFIX }}-${{ matrix.id }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  package-macos:
    name: Package macOS application (${{ matrix.id }})
    needs: preflight
    environment: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'release' || 'package-validation' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-x86_64
            arch: x86_64
            runner: macos-26-intel

          - id: macos-aarch64
            arch: aarch64
            runner: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Download third-party legal artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-legal
          path: target/legal

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: true
          cache-bin: true
          cache-all-crates: true
          cache-on-failure: true

      - name: Install cargo-packager
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: cargo-packager@${{ env.CARGO_PACKAGER_VERSION }}

      - name: Verify updater signing configuration
        run: test -n "$STYRHOUS_UPDATER_PUBLIC_KEY"

      - name: Build release application
        run: cargo build --release --locked -p styrhous

      - name: Package macOS application
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ "$SIGN_ARTIFACTS" == "true" ]]; then
            test -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY"
            test -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD"
          else
            unset CARGO_PACKAGER_SIGN_PRIVATE_KEY
            unset CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD
          fi
          cargo packager \
            --manifest-path crates/styrhous/Cargo.toml \
            --release \
            --formats app,dmg

      - name: Generate updater manifest
        if: env.SIGN_ARTIFACTS == 'true'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/styrhous/Cargo.toml | head -1)
          bundle=$(find dist -type f -name '*.app.tar.gz' -print -quit)
          test -n "$bundle"

          bash scripts/generate-update-manifest.sh \
            "$version" \
            macos \
            "${{ matrix.arch }}" \
            app \
            "$bundle" \
            "dist/styrhous-update-${{ matrix.id }}.json"

      - name: Smoke test macOS DMG startup
        timeout-minutes: 2
        env:
          STYRHOUS_DISABLE_AUTO_UPDATE: "1"
        run: |
          temporary_directory=$(mktemp -d)
          mount_point="$temporary_directory/mount"
          mkdir "$mount_point"
          trap 'hdiutil detach "$mount_point" -quiet || true; rm -rf "$temporary_directory"' EXIT

          dmg=$(find dist -type f -name '*.dmg' -print -quit)
          test -n "$dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"

          app=$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          cp -R "$app" "$temporary_directory/Styrhous.app"
          bash scripts/verify-packaged-legal-files.sh "$temporary_directory/Styrhous.app"

          executable=$(find "$temporary_directory/Styrhous.app/Contents/MacOS" -type f -perm -u+x -print -quit)
          test -n "$executable"
          "$executable" &
          process_id=$!
          sleep 5
          kill -0 "$process_id"
          kill "$process_id" || true
          wait "$process_id" || true

      - name: Upload macOS packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE_ARTIFACT_PREFIX }}-${{ matrix.id }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  package-windows:
    name: Package Windows installer (${{ matrix.id }})
    needs: preflight
    environment: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'release' || 'package-validation' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - id: windows-x86_64
            arch: x86_64
            runner: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Download third-party legal artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-legal
          path: target/legal

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: true
          cache-bin: true
          cache-all-crates: true
          cache-on-failure: true

      - name: Install cargo-packager
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: cargo-packager@${{ env.CARGO_PACKAGER_VERSION }}

      - name: Verify updater signing configuration
        shell: bash
        run: test -n "$STYRHOUS_UPDATER_PUBLIC_KEY"

      - name: Build release application
        shell: bash
        run: cargo build --release --locked -p styrhous

      - name: Package Windows installer
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ "$SIGN_ARTIFACTS" == "true" ]]; then
            test -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY"
            test -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD"
          else
            unset CARGO_PACKAGER_SIGN_PRIVATE_KEY
            unset CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD
          fi
          cargo packager \
            --manifest-path crates/styrhous/Cargo.toml \
            --release \
            --formats nsis

      - name: Generate updater manifest
        if: env.SIGN_ARTIFACTS == 'true'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/styrhous/Cargo.toml | head -1)
          bundle=$(find dist -type f -name '*.exe' -print -quit)
          test -n "$bundle"

          bash scripts/generate-update-manifest.sh \
            "$version" \
            windows \
            "${{ matrix.arch }}" \
            nsis \
            "$bundle" \
            "dist/styrhous-update-${{ matrix.id }}.json"

      - name: Smoke test Windows NSIS install and startup
        shell: pwsh
        timeout-minutes: 2
        env:
          STYRHOUS_DISABLE_AUTO_UPDATE: "1"
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'styrhous-installer-smoke'
          $installer = Get-ChildItem -Path dist -Filter '*.exe' -Recurse | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer was not produced' }

          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installer exited with $($install.ExitCode)" }

          & scripts/Verify-PackagedLegalFiles.ps1 -PackageRoot $destination

          $application = Get-ChildItem -Path $destination -Filter '*.exe' -Recurse |
            Where-Object { $_.Name -ne 'Uninstall.exe' } |
            Select-Object -First 1
          if ($null -eq $application) { throw 'Installed application executable was not found' }

          $process = Start-Process -FilePath $application.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "Installed application exited with $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force

          $uninstaller = Get-ChildItem -Path $destination -Filter 'Uninstall.exe' -Recurse | Select-Object -First 1
          if ($null -eq $uninstaller) { throw 'NSIS uninstaller was not found' }

          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstaller exited with $($uninstall.ExitCode)" }
          if (Test-Path $destination) { throw 'NSIS uninstaller left its destination behind' }

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE_ARTIFACT_PREFIX }}-${{ matrix.id }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  package-deb:
    name: Package Debian application (${{ matrix.id }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64-deb
            runner: ubuntu-24.04

          - id: linux-aarch64-deb
            runner: ubuntu-24.04-arm
    env:
      STYRHOUS_DISABLE_AUTO_UPDATE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Download third-party legal artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-legal
          path: target/legal

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: true
          cache-bin: true
          cache-all-crates: true
          cache-on-failure: true

      - name: Install package dependencies
        run: bash scripts/install-appimage-package-dependencies.sh

      - name: Install cargo-packager
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: cargo-packager@${{ env.CARGO_PACKAGER_VERSION }}

      - name: Build package-managed application
        run: cargo build --release --locked -p styrhous

      - name: Build Debian package
        run: |
          cargo packager \
            --manifest-path crates/styrhous/Cargo.toml \
            --release \
            --formats deb

      - name: Smoke test Debian package startup
        timeout-minutes: 2
        run: |
          package=$(find dist -type f -name '*.deb' -exec realpath {} \; -quit)
          test -n "$package"
          dpkg-deb -f "$package" Depends | grep -Fx 'libxkbcommon-x11-0'

          temporary_directory=$(mktemp -d)
          trap 'rm -rf "$temporary_directory"' EXIT
          dpkg-deb --extract "$package" "$temporary_directory"
          bash scripts/verify-packaged-legal-files.sh "$temporary_directory"

          sudo apt-get install --yes "$package"
          executable=$(dpkg -L styrhous | awk '/\/usr\/bin\// { print; exit }')
          test -n "$executable"

          set +e
          timeout --kill-after=5s 10s xvfb-run -a "$executable"
          status=$?
          set -e
          test "$status" -eq 124

          sudo apt-get purge --yes styrhous

      - name: Upload Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE_ARTIFACT_PREFIX }}-${{ matrix.id }}
          path: dist/**/*.deb
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 7 || 1 }}

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - package-appimage
      - package-macos
      - package-windows
      - package-deb
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download third-party legal artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-legal
          path: target/legal

      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          mapfile -d '' legal_assets < <(bash scripts/copy-release-legal-assets.sh dist)

          update_ids=(macos-x86_64 macos-aarch64 windows-x86_64 linux-x86_64 linux-aarch64)
          for update_id in "${update_ids[@]}"; do
            manifest="dist/styrhous-update-${update_id}.json"
            test -f "$manifest"
            jq -e --arg version "$version" '
              .version == $version
              and (.url | startswith("https://github.com/zlepper/styrhous/releases/download/v" + $version + "/"))
              and (.signature | type == "string" and length > 0)
              and (.format | IN("app", "appimage", "nsis"))
            ' "$manifest" >/dev/null

            update_asset="$(jq -r '.url | split("/") | last' "$manifest")"
            mapfile -t matching_assets < <(find dist -type f -name "$update_asset" -print)
            test "${#matching_assets[@]}" -eq 1
            test -f "${matching_assets[0]}.sig"
          done

          mapfile -t deb_assets < <(find dist -type f -name '*.deb' -print)
          test "${#deb_assets[@]}" -eq 2

          mapfile -d '' assets < <(find dist -type f \( \
            -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.exe' -o \
            -name '*.AppImage' -o -name '*.deb' -o -name '*.sig' -o \
            -name 'styrhous-update-*.json' \
          \) -print0)
          assets+=("${legal_assets[@]}")
          test "${#assets[@]}" -gt 0

          release_args=(--verify-tag --generate-notes)
          if [[ "$TAG" == *-* ]]; then
            release_args+=(--title "Preview $TAG")
          fi

          gh release create "$TAG" "${release_args[@]}" "${assets[@]}"
