name: Licensing

on:
  push:
    branches: [master]
    paths:
      - "licensing/**"
      - "assets/icons/kubernetes-dev-ui.svg"
      - "crates/components/assets/icons/**"
      - "crates/components/assets/fonts/**"
      - "crates/components/tests/snapshots/buttons/test_button_interaction_states/**"
      - "crates/components/tests/snapshots/comboboxes/test_combobox_flow/closed.png"
      - "crates/components/tests/snapshots/showcase/showcase_buttons/buttons.png"
      - "crates/components/tests/snapshots/text_inputs/snapshots_empty_filled_and_focused_inputs/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/licensing.yml"
  pull_request:
    paths:
      - "licensing/**"
      - "assets/icons/kubernetes-dev-ui.svg"
      - "crates/components/assets/icons/**"
      - "crates/components/assets/fonts/**"
      - "crates/components/tests/snapshots/buttons/test_button_interaction_states/**"
      - "crates/components/tests/snapshots/comboboxes/test_combobox_flow/closed.png"
      - "crates/components/tests/snapshots/showcase/showcase_buttons/buttons.png"
      - "crates/components/tests/snapshots/text_inputs/snapshots_empty_filled_and_focused_inputs/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/licensing.yml"
  workflow_dispatch:

permissions:
  contents: read

# Deployment happens through Cloudflare Workers Builds; this workflow only validates.
jobs:
  worker:
    name: Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: licensing/worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            licensing/worker/package-lock.json
            licensing/portal/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check types and generated bindings
        run: npm run check
      - name: Run Worker tests
        run: npm test
      - name: Build the deployable Worker and portal
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: licensing/portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: licensing/portal/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check types and Svelte components
        run: npm run check
      - name: Run unit tests
        run: npm run test:unit
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload browser test failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licensing-portal-browser-failures
          path: |
            licensing/portal/playwright-report/
            licensing/portal/test-results/
          if-no-files-found: ignore
          retention-days: 7
