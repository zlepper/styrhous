name: Licensing

on:
  push:
    branches: ["**"]
    paths:
      - "licensing/**"
      - "crates/components/tests/snapshots/buttons/test_button_interaction_states/**"
      - "crates/components/tests/snapshots/comboboxes/test_combobox_flow/closed.png"
      - "crates/components/tests/snapshots/showcase/showcase_buttons/buttons.png"
      - "crates/components/tests/snapshots/text_inputs/snapshots_empty_filled_and_focused_inputs/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/licensing.yml"
      - ".github/workflows/deploy-licensing.yml"
      - ".github/workflows/preview-licensing-staging.yml"
      - ".github/workflows/run-licensing-stack.yml"

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: licensing/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: licensing/backend/global.json
      - name: Start backend services
        run: docker compose --file ../compose.yaml up --detach --wait postgres rabbitmq
      - name: Check backend
        run: bash check.sh
      - name: Build deployment image
        working-directory: licensing
        run: docker build --file backend/Dockerfile --tag styrhous-licensing-ci .
      - name: Smoke-test migration image entrypoint
        run: >-
          docker run --rm --network host styrhous-licensing-ci migrate
          "--ConnectionStrings:Licensing=Host=127.0.0.1;Port=55432;Database=postgres;Username=styrhous;Password=local-development-only;Pooling=false"
      - name: Smoke-test infrastructure provisioning entrypoint
        env:
          STYRHOUS_APPLICATION_CONFIGURATION: >-
            {"ConnectionStrings":{"Licensing":"Host=127.0.0.1;Port=55432;Database=postgres;Username=styrhous;Password=local-development-only;Pooling=false"},"DatabaseRuntimeRole":{"Username":"styrhous_ci_runtime","Password":"local-ci-runtime-only"}}
        run: >-
          docker run --rm --network host --entrypoint dotnet
          --env STYRHOUS_APPLICATION_CONFIGURATION styrhous-licensing-ci
          database-provisioning/Styrhous.Licensing.DatabaseProvisioning.dll

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: licensing/infrastructure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Check infrastructure
        run: bash check.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: licensing/portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: licensing/portal/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check types and Svelte components
        run: npm run check
      - name: Run unit tests
        run: npm run test:unit
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload browser test failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: licensing-portal-browser-failures
          path: |
            licensing/portal/playwright-report/
            licensing/portal/test-results/
          if-no-files-found: ignore
          retention-days: 7
