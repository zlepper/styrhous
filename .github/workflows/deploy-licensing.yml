name: Deploy licensing

on:
  workflow_dispatch:

concurrency:
  group: licensing-production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    environment: licensing-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master
      - name: Deploy the licensing monolith
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy . --ha=false --remote-only --config licensing/fly.toml
