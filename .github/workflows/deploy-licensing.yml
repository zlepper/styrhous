name: Deploy licensing

on:
  workflow_dispatch:

concurrency:
  group: licensing-production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/run-licensing-stack.yml
    with:
      operation: deploy
      environment_name: licensing-production
      allow_image_bootstrap: true
    secrets: inherit
