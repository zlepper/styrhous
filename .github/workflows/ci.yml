name: Tests

on:
  push:
    branches: ["**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Rust formatting
        run: cargo fmt --check

  lint:
    name: Lint and check Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: true
          cache-bin: true
          cache-all-crates: true
          cache-on-failure: true

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check without default features
        run: cargo check --locked -p styrhous --no-default-features

  workspace-tests:
    name: Test Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: true
          cache-bin: true
          cache-all-crates: true
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: cargo-nextest@0.9.140

      - name: Install Mesa software renderer
        run: sudo apt-get install --yes libegl1 libgl1-mesa-dri

      - name: Run workspace tests without Kind integrations
        env:
          WGPU_BACKEND: gl
        run: cargo nextest run --workspace --locked -E 'not test(/ui::tests::kind::/)'

      - name: Upload snapshot test failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-test-failures
          path: |
            crates/**/tests/snapshots/**/*.diff.png
            crates/**/tests/snapshots/**/*.new.png
            crates/**/tests/snapshots/**/*.accessibility.new.txt
          if-no-files-found: ignore
          retention-days: 7

  kind-tests:
    name: Test Kind integrations
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: true
          cache-bin: true
          cache-all-crates: true
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: cargo-nextest@0.9.140

      - name: Install Mesa software renderer
        run: sudo apt-get install --yes libegl1 libgl1-mesa-dri

      - name: Run Kind-backed integration tests
        env:
          WGPU_BACKEND: gl
        run: cargo nextest run -p styrhous --locked -E 'test(/ui::tests::kind::/)'

  doctests:
    name: Test Rust documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: true
          cache-bin: true
          cache-all-crates: true
          cache-on-failure: true

      - name: Run workspace doctests
        run: cargo test --doc --workspace --locked

  repository-checks:
    name: Check repository artifacts and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-about
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: cargo-about@0.9.1

      - name: Generate third-party legal artifacts
        run: bash scripts/generate-third-party-legal.sh

      - name: Test release scripts
        run: |
          bash scripts/test-generate-update-manifest.sh
          bash scripts/test-setup-local-development-icon.sh
