name: Preview licensing staging

on:
  workflow_dispatch:

concurrency:
  group: licensing-staging-preview
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  preview:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/run-licensing-stack.yml
    with:
      operation: preview
      environment_name: licensing-staging
      allow_image_bootstrap: false
    secrets: inherit
