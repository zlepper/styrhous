# Harbour design oracles: one [[board]] per artboard.
#
# Fields (paths are relative to the repository root):
#   id        Board ID, also the oracle file stem (docs/design-oracles/harbour/<id>.png).
#   title     The artboard title from the design source.
#   oracle    Rendered design PNG (scripts/design-oracles: npm run render).
#   snapshot  egui snapshot PNG written by the board's oracle test; "" until that test exists.
#             scripts/design-oracles/compare.sh only compares boards with a snapshot.
#   [[board.regions]]  Optional crops compared on their own (component boards), each with
#             name, x, y, width, height in board pixels, e.g.
#               [[board.regions]]
#               name = "primary-button"
#               x = 180
#               y = 240
#               width = 104
#               height = 32

