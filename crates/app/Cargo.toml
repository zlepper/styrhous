[package]
name = "kubernetes-dev-ui"
version = "0.0.1-alpha.1"
edition = "2024"
description = "A desktop UI for exploring Kubernetes clusters"
homepage = "https://github.com/zlepper/kubernetes-dev-ui"
repository = "https://github.com/zlepper/kubernetes-dev-ui"

[features]
default = ["self-updater"]
self-updater = ["dep:cargo-packager-updater", "dep:minisign-verify"]

[package.metadata.packager]
product_name = "Kubernetes Dev UI"
identifier = "io.github.zlepper.kubernetes-dev-ui"
publisher = "Kubernetes Dev UI"
description = "A desktop UI for exploring Kubernetes clusters"
homepage = "https://github.com/zlepper/kubernetes-dev-ui"
category = "DeveloperTool"
icons = ["../../assets/icons/kubernetes-dev-ui.svg"]
formats = ["app", "dmg", "nsis", "appimage", "deb"]
out_dir = "../../dist"
binaries_dir = "../../target/release"

[package.metadata.packager.nsis]
installer_mode = "currentUser"

[dependencies]
eframe = { version = "0.36.1", features = ["persistence"] }
egui = "0.36.1"
egui_extras = { version = "0.36.1", features = ["syntect"] }
components = { path = "../components" }
kube = { version = "3.1", features = ["runtime"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1.48", features = ["rt-multi-thread", "full"] }
k8s-openapi = { version = "0.27", features = ["v1_31"] }
anyhow = "1.0"
async-trait = "0.1"
futures-util = "0.3"
itertools = "0.14"
time = { version = "0.3", features = ["formatting", "parsing"] }
serde_yaml = "0.9"
serde = { version = "1.0", features = ["derive"] }
jsonschema = "0.33"
http = "1.4"
saphyr = "0.0.11"
regex = "1.12"
jsonpath-rust = "0.7.5"
tempfile = "3"
anstyle = "1.0"
anstyle-parse = "1.0"
base64 = "0.22"
flate2 = "1.1"
cargo-packager-updater = { version = "0.2.3", optional = true }
minisign-verify = { version = "0.2.5", optional = true }

[dev-dependencies]
criterion = "0.8.2"
egui_kittest = { version = "0.36.1", features = ["eframe", "wgpu", "snapshot"] }

[[bench]]
name = "log_viewer"
harness = false
