name: styrhous-licensing

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_USER: styrhous
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=styrhous --dbname=postgres"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
